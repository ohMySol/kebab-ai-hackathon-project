<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Gauge: supplier risk decisions you can defend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c10"/>
      <stop offset="1" stop-color="#14161d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#76b900" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#76b900" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2fbf71"/>
      <stop offset="0.55" stop-color="#e3b341"/>
      <stop offset="1" stop-color="#e5534b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glow)"/>

  <!-- Gauge dial -->
  <g transform="translate(1000 300)">
    <path d="M-200 0A200 200 0 0 1 200 0" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="34" stroke-linecap="round"/>
    <path d="M-200 0A200 200 0 0 1 200 0" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round"/>
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
      <path d="M-172 0H-156"/><path d="M-148.9 -86L-135.1 -78"/><path d="M-86 -148.9L-78 -135.1"/>
      <path d="M0 -172V-156"/><path d="M86 -148.9L78 -135.1"/><path d="M148.9 -86L135.1 -78"/><path d="M172 0H156"/>
    </g>
    <path d="M0 0L-96 -110" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <circle r="16" fill="#ffffff"/>
    <circle r="6" fill="#0b0c10"/>
    <text x="0" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#ffffff" fill-opacity="0.55">LOWER RISK FIRST</text>
  </g>

  <!-- Logo mark -->
  <g transform="translate(72 72)">
    <rect width="64" height="64" rx="16" fill="#ffffff"/>
    <path d="M14 43a18 18 0 0 1 36 0" fill="none" stroke="#0b0c10" stroke-width="5" stroke-linecap="round"/>
    <path d="M32 43l9.6-10.8" stroke="#0b0c10" stroke-width="5" stroke-linecap="round"/>
    <circle cx="32" cy="43" r="4.2" fill="#0b0c10"/>
  </g>
  <text x="152" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="#ffffff">gauge</text>

  <!-- Headline -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" letter-spacing="-2" fill="#ffffff">
    <tspan x="72" y="226" font-size="58">Supplier decisions</tspan>
    <tspan x="72" y="290" font-size="58">you can <tspan fill="#76b900">defend.</tspan></tspan>
  </text>
  <text x="72" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.68">10,000 suppliers screened in Python · Nemotron explains · Tavily checks the real world</text>

  <!-- Event pill -->
  <g transform="translate(72 360)">
    <rect width="452" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="20" cy="17" r="5" fill="#76b900"/>
    <text x="36" y="22.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1" fill="#ffffff" fill-opacity="0.85">GTC BERLIN 2026 · SIEMENS SUPPLIER-RISK CHALLENGE</text>
  </g>
